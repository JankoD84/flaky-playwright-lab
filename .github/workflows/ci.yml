name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed:
    name: fixed tests (must be green, 10x each)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=fixed --repeat-each=10 --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-fixed
          path: playwright-report
          retention-days: 7
  flaky-demo:
    name: flaky tests (expected to fail sometimes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=flaky --repeat-each=20 --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-flaky
          path: playwright-report
          retention-days: 7
